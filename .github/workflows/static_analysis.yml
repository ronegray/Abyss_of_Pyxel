name: Static Analysis (Pyright)
on: [pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyxel pyright  # PyxelとPyrightをインストール

      - name: Run Pyright
        run: |
          # 型の不一致や存在しない属性へのアクセスを全ファイルチェック
          # エラーがあれば終了コード1を返し、GitHub上で赤バツが表示される
          npx pyright
